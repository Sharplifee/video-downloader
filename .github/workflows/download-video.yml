name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL to download"
        required: true
        type: string
      quality:
        description: "Quality: 2k, 1080, 720, best, audio"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: |
          pip install -U yt-dlp requests beautifulsoup4
          sudo apt-get install -y ffmpeg -q

      - name: Fetch and download
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          python3 - << 'PYEOF'
          import requests, re, sys, os, html as htmllib, subprocess

          url = os.environ["VIDEO_URL"]
          quality = os.environ.get("QUALITY", "best").lower()

          slug = url.rstrip("/").split("/")[-1]
          slug = re.sub(r'[^\w\-]', '_', slug)
          ext = "mp3" if quality == "audio" else "mp4"
          filename = slug.replace("-", "_") + f".{ext}"
          print(f"Output filename: {filename}")
          with open("video_filename.txt", "w") as f:
              f.write(filename)

          is_youtube = "youtube.com" in url or "youtu.be" in url

          if quality == "audio":
              result = subprocess.run([
                  "yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "0",
                  "--extractor-args", "youtube:player_client=ios,web",
                  "--no-check-certificates",
                  "-o", filename, url
              ], capture_output=True, text=True)
              print(result.stdout)
              print(result.stderr)
              if result.returncode != 0:
                  sys.exit(1)
          elif is_youtube:
              result = subprocess.run([
                  "yt-dlp", "-f", "bestvideo+bestaudio/best",
                  "--merge-output-format", "mp4",
                  "--extractor-args", "youtube:player_client=ios,web",
                  "--no-check-certificates",
                  "-o", filename, url
              ], capture_output=True, text=True)
              print(result.stdout)
              print(result.stderr)
              if result.returncode != 0:
                  sys.exit(1)
          else:
              base_headers = {
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/125.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.5",
                  "Accept-Encoding": "identity",
              }

              session = requests.Session()
              from urllib.parse import urlparse
              base_url = f"{urlparse(url).scheme}://{urlparse(url).netloc}"
              session.get(base_url, headers=base_headers)
              resp = session.get(url, headers={**base_headers, "Referer": base_url})
              html = resp.text

              video_url = None

              fp = re.search(r'id="wpfp_[^"]*"[^>]*data-item="([^"]+)"', html)
              if fp:
                  decoded = htmllib.unescape(fp.group(1)).replace('\\/', '/')
                  cdn = re.search(r'"src"\s*:\s*"(https?[^"]+\.mp4)"', decoded)
                  if cdn:
                      video_url = cdn.group(1)
                      print(f"Found via data-item: {video_url}")

              if not video_url:
                  mp4_urls = re.findall(r'(https?://[^\s"\'<>]+/get_file/[^\s"\'<>]+\.mp4[^\s"\'<>\/]*)', html)
                  mp4_urls = [u for u in mp4_urls if "preview" not in u and ".jpg" not in u]
                  mp4_urls = list(dict.fromkeys(mp4_urls))
                  for candidate in mp4_urls:
                      r = session.get(candidate, headers={**base_headers, "Referer": url}, stream=True, allow_redirects=True)
                      if r.status_code == 200 and "video" in r.headers.get("Content-Type", ""):
                          video_url = candidate
                          print(f"Working: {candidate.split('/')[-1]} ({r.headers.get('Content-Length','?')} bytes)")
                          r.close()
                          break
                      r.close()

              if not video_url:
                  print("No video URL found")
                  sys.exit(1)

              r = session.get(video_url, headers={**base_headers, "Referer": url}, stream=True, allow_redirects=True)
              total = 0
              with open(filename, "wb") as f:
                  for chunk in r.iter_content(chunk_size=131072):
                      f.write(chunk)
                      total += len(chunk)
              print(f"Downloaded {total/1024/1024:.1f} MB")
          PYEOF

      - name: Read filename
        id: vars
        run: echo "filename=$(cat video_filename.txt)" >> $GITHUB_OUTPUT

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 1
