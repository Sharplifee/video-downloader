name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL to download"
        required: true
        type: string
      quality:
        description: "Quality (e.g. 2k, 1080, best)"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install -U yt-dlp requests beautifulsoup4

      - name: Extract and download video
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          python3 - << 'PYEOF'
          import requests, re, subprocess, sys, os

          url = os.environ["VIDEO_URL"]
          quality = os.environ.get("QUALITY", "best").lower()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Referer": url
          }

          resp = requests.get(url, headers=headers)
          html = resp.text

          # Find all get_file mp4 URLs (actual video files, not previews or thumbnails)
          mp4_urls = re.findall(r'(https?://[^\s"\'<>]+/get_file/[^\s"\'<>]+\.mp4[^\s"\'<>]*)', html)
          if not mp4_urls:
              mp4_urls = re.findall(r'"file"\s*:\s*"(https?://[^"]+\.mp4[^"]*)"', html)
          if not mp4_urls:
              mp4_urls = re.findall(r'(https?://[^\s"\'<>]+\.mp4[^\s"\'<>]*)', html)

          # Filter out preview/thumbnail files
          mp4_urls = [u for u in mp4_urls if "preview" not in u and ".jpg" not in u and "screenshot" not in u]
          mp4_urls = list(dict.fromkeys(mp4_urls))  # deduplicate

          print(f"Found {len(mp4_urls)} candidate MP4 URLs:")
          for u in mp4_urls:
              print(f"  {u}")

          def res_priority(u):
              if "1440p" in u or "1440" in u: return 4
              if "1080p" in u or "1080" in u: return 3
              if "720p" in u or "720" in u: return 2
              if "360p" in u or "360" in u: return 1
              return 0

          if mp4_urls:
              if quality == "2k":
                  # Pick 1440p if available, else highest
                  selected = sorted(mp4_urls, key=res_priority, reverse=True)[0]
              else:
                  selected = mp4_urls[0]

              print(f"Selected: {selected}")
              r = requests.get(selected, headers=headers, stream=True)
              total = 0
              with open("video_download.mp4", "wb") as f:
                  for chunk in r.iter_content(chunk_size=65536):
                      f.write(chunk)
                      total += len(chunk)
              print(f"Downloaded {total} bytes successfully")
          else:
              print("No MP4 found, falling back to yt-dlp...")
              result = subprocess.run([
                  "yt-dlp", "-v", "--no-check-certificate",
                  "-o", "video_download.mp4",
                  "--user-agent", headers["User-Agent"],
                  "--referer", url, url
              ], capture_output=True, text=True)
              print(result.stdout[-3000:])
              print(result.stderr[-3000:])
              if result.returncode != 0:
                  sys.exit(1)
          PYEOF

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: video_download.mp4
          retention-days: 1
