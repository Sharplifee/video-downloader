name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video URL to download"
        required: true
        type: string
      quality:
        description: "Quality: 2k, 1080, 720, best"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - name: Install dependencies
        run: pip install -U yt-dlp requests beautifulsoup4

      - name: Fetch page and download video from same IP
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          python3 - << 'PYEOF'
          import requests, re, sys, os

          url = os.environ["VIDEO_URL"]
          quality = os.environ.get("QUALITY", "best").lower()

          # Extract filename from URL slug
          slug = url.rstrip("/").split("/")[-1]
          filename = slug.replace("-", "_") + ".mp4"
          print(f"Output filename: {filename}")

          # Write filename for next step
          with open("video_filename.txt", "w") as f:
              f.write(filename)

          session = requests.Session()
          headers = {
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36",
              "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
              "Accept-Language": "en-US,en;q=0.5",
              "Connection": "keep-alive",
          }

          print(f"Fetching page: {url}")
          resp = session.get(url, headers=headers)
          html = resp.text
          print(f"Page status: {resp.status_code}")

          mp4_urls = re.findall(r'(https?://[^\s"\'<>]+/get_file/[^\s"\'<>]+\.mp4[^\s"\'<>\/]*)', html)
          mp4_urls = [u for u in mp4_urls if "preview" not in u and ".jpg" not in u]
          mp4_urls = list(dict.fromkeys(mp4_urls))

          print(f"Found {len(mp4_urls)} candidate URLs:")
          for u in mp4_urls:
              print(f"  {u}")

          def res_score(u):
              if "1440p" in u: return 4
              if "1080p" in u: return 3
              if "720p"  in u: return 2
              if "360p"  in u: return 1
              return 0

          if not mp4_urls:
              print("No MP4 URLs found")
              sys.exit(1)

          if quality == "2k":
              selected = sorted(mp4_urls, key=res_score, reverse=True)[0]
          elif quality == "1080":
              selected = sorted(mp4_urls, key=lambda u: abs(res_score(u)-3))[0]
          elif quality == "720":
              selected = sorted(mp4_urls, key=lambda u: abs(res_score(u)-2))[0]
          else:
              selected = sorted(mp4_urls, key=res_score, reverse=True)[0]

          print(f"Selected ({quality}): {selected}")

          headers["Referer"] = url
          r = session.get(selected, headers=headers, stream=True)
          print(f"Download status: {r.status_code}, Content-Type: {r.headers.get('Content-Type')}")

          if r.status_code != 200 or "text/html" in r.headers.get("Content-Type",""):
              for candidate in sorted(mp4_urls, key=res_score, reverse=True):
                  r = session.get(candidate, headers=headers, stream=True)
                  if r.status_code == 200 and "video" in r.headers.get("Content-Type",""):
                      print(f"Success with: {candidate}")
                      break
              else:
                  print("All URLs failed")
                  sys.exit(1)

          total = 0
          with open(filename, "wb") as f:
              for chunk in r.iter_content(chunk_size=65536):
                  f.write(chunk)
                  total += len(chunk)
          print(f"Downloaded {total:,} bytes ({total/1024/1024:.1f} MB) as {filename}")
          PYEOF

      - name: Read filename
        id: vars
        run: echo "filename=$(cat video_filename.txt)" >> $GITHUB_OUTPUT

      - name: Upload video as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 1
