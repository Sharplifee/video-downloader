name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page URL to download"
        required: true
        type: string
      quality:
        description: "Preferred quality: best, 1080, 720, 480, audio"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: |
          pip install -U yt-dlp requests beautifulsoup4 lxml cloudscraper curl_cffi
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      - name: Fetch and download
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, html as htmllib, subprocess, json
          from urllib.parse import urlparse, urljoin
          import requests
          from bs4 import BeautifulSoup

          try:
              import cloudscraper
              HAS_CS = True
          except ImportError:
              HAS_CS = False

          url = os.environ["VIDEO_URL"].strip()
          quality = os.environ.get("QUALITY", "best").lower().strip()
          prefer_h = {"best": 9999, "2160": 2160, "1080": 1080, "720": 720, "480": 480, "360": 360}.get(quality, 9999)

          print("=" * 60)
          print(f"INPUT URL : {url}")
          print(f"QUALITY   : {quality}")
          print("=" * 60)

          slug = re.sub(r"[^\w\-]", "_", url.rstrip("/").split("/")[-1])[:80]
          ext = "mp3" if quality == "audio" else "mp4"
          filename = f"{slug}.{ext}"
          print(f"Output filename: {filename}")
          open("video_filename.txt", "w").write(filename)

          def make_session():
              s = None
              try:
                  from curl_cffi import requests as cfreq
                  s = cfreq.Session(impersonate="chrome131")
                  print("[session] curl_cffi chrome131")
              except Exception as e:
                  print("[session] curl_cffi unavailable:", e)
                  if HAS_CS:
                      s = cloudscraper.create_scraper(browser={"browser": "chrome", "platform": "windows", "mobile": False})
                      print("[session] cloudscraper")
                  else:
                      s = requests.Session()
                      print("[session] requests")
              try:
                  s.headers.update({
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": url,
                  })
              except Exception:
                  pass
              return s

          def download_file(session, video_url, referer=None):
              headers = {"Referer": referer or url, "User-Agent": session.headers.get("User-Agent")}
              r = session.get(video_url, headers=headers, stream=True, timeout=90, allow_redirects=True)
              r.raise_for_status()
              total = 0
              with open(filename, "wb") as f:
                  for chunk in r.iter_content(256 * 1024):
                      if chunk:
                          f.write(chunk)
                          total += len(chunk)
              mb = total / (1024 * 1024)
              print(f"✅ Downloaded {mb:.1f} MB → {filename}")
              if mb < 0.5:
                  raise RuntimeError("File too small")
              return True

          def download_hls(m3u8_url, height=None):
              cmd = ["yt-dlp", "--no-check-certificates", "-o", filename, "--merge-output-format", "mp4"]
              if height and prefer_h < 9999:
                  cmd += ["-f", f"best[height<={prefer_h}]/best"]
              else:
                  cmd += ["-f", "best"]
              cmd.append(m3u8_url)
              print(f"[hls] yt-dlp {m3u8_url[:80]}...")
              p = subprocess.run(cmd, capture_output=True, text=True, timeout=1200)
              if p.stderr:
                  print(p.stderr[-1200:])
              if p.returncode == 0 and os.path.exists(filename) and os.path.getsize(filename) > 20000:
                  print(f"✅ HLS OK → {os.path.getsize(filename)/1024/1024:.1f} MB")
                  return True
              return False

          def run_ytdlp():
              formats = ["bestvideo+bestaudio/best", "best"] if quality != "audio" else ["bestaudio/best"]
              for fmt in formats:
                  cmd = ["yt-dlp", "--no-check-certificates", "--retries", "3", "-o", filename, "-f", fmt, "--merge-output-format", "mp4", "--extractor-args", "generic:impersonate", url]
                  if quality == "audio":
                      cmd = ["yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "0", "--no-check-certificates", "-o", filename, url]
                  print(f"[yt-dlp] format={fmt}")
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=900)
                  if p.stderr:
                      print(p.stderr[-1000:])
                  if p.returncode == 0 and os.path.exists(filename) and os.path.getsize(filename) > 20000:
                      print(f"✅ yt-dlp OK → {os.path.getsize(filename)/1024/1024:.1f} MB")
                      return True
              return False

          def extract_beeg(session, page_url):
              print("[beeg] dedicated extractor")
              m = re.search(r"beeg\.com/(?:video/)?-?(\d+)", page_url, re.I)
              if not m:
                  return None
              raw_id = m.group(1)
              # normalize: URLs like -02213... need leading 0 stripped for API
              video_id = raw_id.lstrip("0") or raw_id
              if raw_id.startswith("0") and len(raw_id) > 1:
                  video_id = raw_id.lstrip("0")
              print(f"[beeg] id={video_id} (from {raw_id})")
              api = f"https://store.externulls.com/facts/file/{video_id}"
              r = session.get(api, headers={"Referer": "https://beeg.com/", "Origin": "https://beeg.com"}, timeout=25)
              if r.status_code != 200:
                  print(f"[beeg] API {r.status_code}: {r.text[:200]}")
                  return None
              data = r.json()
              file_obj = data.get("file") or {}
              # HLS multi playlist
              hls = (file_obj.get("hls_resources") or {}).get("fl_cdn_multi")
              if hls:
                  m3u8 = f"https://video.beeg.com/{hls}"
                  print(f"[beeg] HLS multi: {m3u8[:100]}...")
                  if download_hls(m3u8):
                      return "DONE"
              # fallback direct template
              fallback = file_obj.get("fallback") or ""
              # qualities list
              quals = []
              for block in (file_obj.get("qualities") or {}).get("h264") or []:
                  q = block.get("quality") or 0
                  quals.append(q)
              for fact in data.get("fc_facts") or []:
                  for block in (fact.get("qualities") or {}).get("h264") or []:
                      q = block.get("quality") or 0
                      if q not in quals:
                          quals.append(q)
              quals = sorted(set(quals), reverse=True)
              print(f"[beeg] qualities: {quals}")
              # try building direct mp4 from fallback pattern if present
              # fallback looks like: key=...,end=...,limit=3/data=.../480p/ID.mp4
              if fallback and "data=" in fallback:
                  base = "https://video.beeg.com/" + fallback
                  for q in quals:
                      if prefer_h < 9999 and q > prefer_h:
                          continue
                      # replace quality segment
                      candidate = re.sub(r"/\d+p/", f"/{q}p/", base)
                      if f"/{q}p/" not in candidate:
                          candidate = base.replace("/480p/", f"/{q}p/")
                      print(f"[beeg] try direct {q}p")
                      try:
                          download_file(session, candidate, referer="https://beeg.com/")
                          return "DONE"
                      except Exception as e:
                          print(f"  fail {q}p: {e}")
              return None

          def extract_eporner(session, page_url):
              print("[eporner] dedicated extractor")
              m = re.search(r"eporner\.com/(?:(?:hd-porn|embed)/|video-)([A-Za-z0-9]+)", page_url, re.I)
              if not m:
                  return None
              video_id = m.group(1)
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              html = r.text
              if "deletedfile" in html or "Video has been deleted" in html:
                  print("[eporner] deleted")
                  return None
              hm = re.search(r'hash\s*[:=]\s*["\']([a-f0-9]{32})', html, re.I)
              if not hm:
                  return None
              vid_hash = hm.group(1)
              def encode_base_n(num, n, digits="0123456789abcdefghijklmnopqrstuvwxyz"):
                  if num == 0: return digits[0]
                  s = []
                  while num:
                      s.append(digits[num % n]); num //= n
                  return "".join(reversed(s))
              def calc_hash(s):
                  return "".join(encode_base_n(int(s[i:i+8], 16), 36) for i in range(0, 32, 8))
              h = calc_hash(vid_hash)
              api = f"https://www.eporner.com/xhr/video/{video_id}"
              jr = session.get(api, params={"hash": h, "device": "generic", "domain": "www.eporner.com", "fallback": "false"},
                               headers={"X-Requested-With": "XMLHttpRequest", "Referer": page_url}, timeout=30)
              data = jr.json()
              if data.get("available") is False:
                  return None
              candidates = []
              for kind, formats in (data.get("sources") or {}).items():
                  if not isinstance(formats, dict): continue
                  for fid, fdict in formats.items():
                      if not isinstance(fdict, dict): continue
                      src = fdict.get("src")
                      if not src or not src.startswith("http"): continue
                      height = int(re.search(r"(\d+)p", fid, re.I).group(1)) if re.search(r"(\d+)p", fid, re.I) else 0
                      candidates.append((height, src, fid))
              if not candidates: return None
              candidates.sort(key=lambda x: x[0], reverse=True)
              for height, src, fid in candidates:
                  if height <= prefer_h or prefer_h >= 9999:
                      print(f"[eporner] {fid}")
                      return src
              return candidates[0][1]

          def extract_kvs(session, page_url):
              print("[kvs] dedicated extractor")
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              html = r.text
              soup = BeautifulSoup(html, "lxml")
              candidates = []
              def add(u, height, source):
                  if not u or not u.startswith("http"): return
                  u = u.replace("\\/", "/").replace("&amp;", "&").rstrip("/")
                  low = u.lower()
                  if any(x in low for x in ["preview", "thumb", "trailer", ".jpg", ".png", "sprite"]): return
                  candidates.append((height or 0, u, source))
              for script in soup.find_all("script"):
                  txt = script.string or script.get_text() or ""
                  if "video_url" not in txt and "kt_player" not in txt: continue
                  for m in re.finditer(r"video_url\s*:\s*['\"](https?[^'\"]+)['\"]", txt):
                      add(m.group(1), 360, "video_url")
                  for m in re.finditer(r"video_alt_url(?:\d*)\s*:\s*['\"](https?[^'\"]+)['\"]", txt):
                      h = 720
                      if "1080" in m.group(1): h = 1080
                      elif "720" in m.group(1): h = 720
                      elif "480" in m.group(1): h = 480
                      add(m.group(1), h, "video_alt")
              for m in re.finditer(r'(https?://[^\s"\'<>]+/get_file/[^\s"\'<>]+?\.(?:mp4|m3u8)[^\s"\'<>]*)', html):
                  u = m.group(1)
                  h = 1080 if "1080" in u else (720 if "720" in u else (480 if "480" in u else 500))
                  add(u, h, "get_file")
              for src_tag in soup.find_all(["source", "video"]):
                  src = src_tag.get("src") or src_tag.get("data-src")
                  if src: add(urljoin(page_url, src), 400, "html5")
              if not candidates:
                  return None
              best = {}
              for h, u, src in candidates:
                  if u not in best or h > best[u][0]:
                      best[u] = (h, src)
              ranked = sorted(((h, u, s) for u, (h, s) in best.items()), key=lambda x: x[0], reverse=True)
              print(f"[kvs] {len(ranked)} candidates")
              for h, u, s in ranked[:5]:
                  print(f"  {h}p ({s}) {u[:90]}...")
              for h, u, s in ranked:
                  if prefer_h < 9999 and h > prefer_h and h: continue
                  try:
                      head = session.get(u, headers={"Referer": page_url}, stream=True, timeout=15, allow_redirects=True)
                      ct = head.headers.get("Content-Type", "").lower()
                      cl = head.headers.get("Content-Length")
                      head.close()
                      if head.status_code == 200 and ("video" in ct or "octet" in ct or (cl and int(cl) > 300000)):
                          print(f"[kvs] selected {h}p")
                          return u
                  except Exception as e:
                      print(f"  skip: {e}")
              return ranked[0][1] if ranked else None

          session = make_session()
          host = urlparse(url).netloc.lower()
          video_url = None

          if "beeg.com" in host:
              try:
                  res = extract_beeg(session, url)
                  if res == "DONE":
                      sys.exit(0)
              except Exception as e:
                  print("[beeg] error:", e)

          if "eporner.com" in host:
              try:
                  video_url = extract_eporner(session, url)
              except Exception as e:
                  print("[eporner] error:", e)

          if not video_url and any(x in host for x in ["pimpbunny", "yourlust", "dirtyship", "hclips", "porntrex"]):
              try:
                  video_url = extract_kvs(session, url)
              except Exception as e:
                  print("[kvs] error:", e)

          if video_url and video_url != "DONE":
              try:
                  download_file(session, video_url, referer=url)
                  sys.exit(0)
              except Exception as e:
                  print("Direct download failed:", e)

          print("\n--- trying yt-dlp ---")
          if run_ytdlp():
              sys.exit(0)

          if not video_url:
              try:
                  video_url = extract_kvs(session, url)
                  if video_url:
                      download_file(session, video_url, referer=url)
                      sys.exit(0)
              except Exception as e:
                  print("[generic-kvs]", e)

          print("❌ All extractors failed")
          sys.exit(1)
          PYEOF

      - name: Read filename
        id: vars
        run: echo "filename=$(cat video_filename.txt)" >> $GITHUB_OUTPUT

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 3
