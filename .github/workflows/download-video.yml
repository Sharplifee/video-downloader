name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page URL to download"
        required: true
        type: string
      quality:
        description: "Preferred quality: best, 2160, 1440, 1080, 720, 480, audio"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Install dependencies
        run: |
          pip install -U yt-dlp requests beautifulsoup4 lxml cloudscraper curl_cffi pycryptodomex
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      - name: Fetch and download
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, html as htmllib, subprocess, json, threading, time
          from urllib.parse import urlparse, urljoin
          import requests
          from bs4 import BeautifulSoup

          try:
              import cloudscraper
              HAS_CS = True
          except ImportError:
              HAS_CS = False

          url = os.environ["VIDEO_URL"].strip()
          quality = os.environ.get("QUALITY", "best").lower().strip()
          prefer_h = {"best": 9999, "2160": 2160, "1440": 1440, "1080": 1080, "720": 720, "480": 480, "360": 360}.get(quality, 9999)

          print("=" * 60)
          print(f"INPUT URL : {url}")
          print(f"QUALITY   : {quality}")
          print("=" * 60)

          host = urlparse(url).netloc.lower()

          def site_prefix():
              if "pornhub" in host: return "ph"
              if "xhamster" in host: return "xh"
              if "watchporn" in host: return "wp"
              if "amateur8" in host: return "a8"
              if "pimpbunny" in host: return "pb"
              if "hqporner" in host: return "hqp"
              if "eporner" in host: return "ep"
              if "beeg" in host: return "beeg"
              if "porntasia" in host: return "pt"
              if "xxxi.porn" in host: return "xxxi"
              return "vid"

          def site_id():
              m = re.search(r"viewkey=([A-Za-z0-9]+)", url)
              if m: return m.group(1)
              m = re.search(r"/(\d{4,})", url)
              if m: return m.group(1)
              m = re.search(r"-([A-Za-z0-9]{5,})$", url.rstrip("/"))
              if m:
                  sid = m.group(1)
                  if "beeg" in host:
                      sid = sid.lstrip("0") or "0"
                  return sid
              slug = re.sub(r"[^\w\-]", "_", url.rstrip("/").split("/")[-1])[:40]
              return slug or "clip"

          ext = "mp3" if quality == "audio" else "mp4"
          filename = f"{site_prefix()}-{site_id()}.{ext}"
          print(f"Output filename: {filename}")
          open("video_filename.txt", "w").write(filename)

          def make_session():
              try:
                  from curl_cffi import requests as cfreq
                  s = cfreq.Session(impersonate="chrome131")
                  print("[session] curl_cffi chrome131")
              except Exception as e:
                  print("[session] curl_cffi unavailable:", e)
                  if HAS_CS:
                      s = cloudscraper.create_scraper(browser={"browser": "chrome", "platform": "windows", "mobile": False})
                      print("[session] cloudscraper")
                  else:
                      s = requests.Session()
                      print("[session] requests")
              try:
                  s.headers.update({
                      "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8",
                      "Accept-Language": "en-US,en;q=0.9",
                      "Referer": url,
                  })
              except Exception:
                  pass
              return s

          def remux(path):
              if not path.endswith(".mp4"):
                  return path
              tmp = path + ".remux.mp4"
              p = subprocess.run(["ffmpeg", "-y", "-i", path, "-c", "copy", "-movflags", "+faststart", tmp, "-hide_banner", "-loglevel", "error"], capture_output=True, text=True, timeout=300)
              if p.returncode == 0 and os.path.exists(tmp) and os.path.getsize(tmp) > 20000:
                  os.replace(tmp, path)
                  print("[remux] faststart ok")
              else:
                  print("[remux] skipped:", p.stderr[-200:] if p.stderr else p.returncode)
              return path

          def download_parallel(session, video_url, referer, size):
              # 8 workers, 8MB chunks. Hosts that throttle per connection finish much faster this way.
              chunk = 8 * 1024 * 1024
              ranges = []
              s = 0
              while s < size:
                  e = min(s + chunk - 1, size - 1)
                  ranges.append((s, e))
                  s = e + 1
              with open(filename, "wb") as f:
                  f.truncate(size)
              lock = threading.Lock()
              idx = [0]
              done = [0]
              fails = []

              def worker():
                  while True:
                      with lock:
                          if idx[0] >= len(ranges):
                              return
                          i = idx[0]
                          idx[0] += 1
                      start, end = ranges[i]
                      ok = False
                      for attempt in range(3):
                          try:
                              r = session.get(video_url, headers={"Referer": referer or url, "Range": f"bytes={start}-{end}"}, timeout=90)
                              if r.status_code in (200, 206) and len(r.content) == (end - start + 1):
                                  with open(filename, "r+b") as f:
                                      f.seek(start)
                                      f.write(r.content)
                                  with lock:
                                      done[0] += 1
                                      if done[0] % 8 == 0 or done[0] == len(ranges):
                                          print(f"[parallel] {done[0]}/{len(ranges)}", flush=True)
                                  ok = True
                                  break
                          except Exception as e:
                              if attempt == 2:
                                  fails.append((i, str(e)))
                      if not ok:
                          fails.append((i, "incomplete"))

              threads = [threading.Thread(target=worker) for _ in range(8)]
              for t in threads:
                  t.start()
              for t in threads:
                  t.join()
              if fails or done[0] != len(ranges):
                  raise RuntimeError(f"parallel incomplete {done[0]}/{len(ranges)} fails={fails[:3]}")
              return True

          def download_file(session, video_url, referer=None):
              headers = {"Referer": referer or url}
              # probe size + range support
              try:
                  head = session.get(video_url, headers={**headers, "Range": "bytes=0-0"}, timeout=20, allow_redirects=True)
                  cr = head.headers.get("Content-Range") or ""
                  size = int(cr.split("/")[-1]) if "/" in cr else int(head.headers.get("Content-Length") or 0)
                  if head.status_code in (200, 206) and size > 50_000_000 and "bytes" in (head.headers.get("Accept-Ranges") or "").lower() or (cr.startswith("bytes")):
                      print(f"[download] parallel {size/1024/1024:.0f} MB")
                      download_parallel(session, video_url, referer, size)
                      remux(filename)
                      print(f"✅ Downloaded {os.path.getsize(filename)/1024/1024:.1f} MB → {filename}")
                      return True
              except Exception as e:
                  print(f"[parallel probe] {e}")
              r = session.get(video_url, headers=headers, stream=True, timeout=120, allow_redirects=True)
              r.raise_for_status()
              total = 0
              with open(filename, "wb") as f:
                  for chunk in r.iter_content(256 * 1024):
                      if chunk:
                          f.write(chunk)
                          total += len(chunk)
              mb = total / (1024 * 1024)
              print(f"✅ Downloaded {mb:.1f} MB → {filename}")
              if mb < 0.5:
                  raise RuntimeError("File too small")
              remux(filename)
              return True

          def run_ytdlp(target=None):
              # One shot. Do not list formats first — signed m3u8 URLs expire (Pornhub 410).
              target = target or url
              if quality == "audio":
                  cmd = ["yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "0", "--no-check-certificates", "-o", filename, target]
              else:
                  fmt = f"best[height<={prefer_h}]/best" if prefer_h < 9999 else "best"
                  cmd = ["yt-dlp", "--no-check-certificates", "--retries", "5", "-o", filename, "-f", fmt, "--merge-output-format", "mp4", target]
              print(f"[yt-dlp] {cmd[cmd.index('-f')+1] if '-f' in cmd else 'audio'} {target[:80]}")
              p = subprocess.run(cmd, capture_output=True, text=True, timeout=1800)
              if p.stderr:
                  print(p.stderr[-800:])
              if p.returncode == 0 and os.path.exists(filename) and os.path.getsize(filename) > 20000:
                  print(f"✅ yt-dlp OK → {os.path.getsize(filename)/1024/1024:.1f} MB")
                  remux(filename)
                  return True
              return False

          def extract_kvs(session, page_url):
              print("[kvs] scanning get_file")
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              html = r.text
              candidates = re.findall(r"https?://[^\"']+get_file/[^\"']+\.mp4[^\"']*", html, re.I)
              ranked = []
              for raw in candidates:
                  u = htmllib.unescape(raw).replace("\\/", "/")
                  if "preview" in u or "screenshot" in u:
                      continue
                  h = 0
                  m = re.search(r"(\d{3,4})p", u)
                  if m:
                      h = int(m.group(1))
                  ranked.append((h, u))
              if not ranked:
                  return None
              ranked.sort(key=lambda x: x[0], reverse=True)
              for h, u in ranked:
                  if prefer_h < 9999 and h and h > prefer_h:
                      continue
                  print(f"[kvs] selected {h or 'default'}p")
                  return u
              return ranked[0][1]

          session = make_session()
          video_url = None

          # Fast path: sites where yt-dlp works if called immediately
          if any(x in host for x in ["pornhub.com", "xhamster.com", "porntasia"]):
              if run_ytdlp():
                  sys.exit(0)

          # Direct get_file sites
          if any(x in host for x in ["watchporn", "amateur8", "pimpbunny", "yourlust", "dirtyship", "hclips", "porntrex", "hobby.porn"]):
              try:
                  video_url = extract_kvs(session, url)
                  if video_url:
                      download_file(session, video_url, referer=url)
                      sys.exit(0)
              except Exception as e:
                  print("[kvs] error:", e)

          # HQPorner via mydaddy embed
          if "hqporner" in host:
              try:
                  r = session.get(url, timeout=25)
                  iframes = re.findall(r'<iframe[^>]+src=["\']([^"\']+)', r.text, re.I)
                  md = next((i if i.startswith("http") else "https:" + i for i in iframes if "mydaddy" in i), None)
                  if md:
                      er = session.get(md, timeout=25, headers={"Referer": url})
                      mp4s = re.findall(r"(?:https?:)?//[^\"']+/\d+\.mp4", er.text)
                      best = None
                      best_h = 0
                      for m in mp4s:
                          m = m if m.startswith("http") else "https:" + m
                          hm = re.search(r"/(\d+)\.mp4", m)
                          h = int(hm.group(1)) if hm else 0
                          if h > best_h and (prefer_h >= 9999 or h <= prefer_h):
                              best, best_h = m, h
                      if best:
                          print(f"[hqporner] {best_h}p")
                          download_file(session, best, referer=md)
                          sys.exit(0)
              except Exception as e:
                  print("[hqporner] error:", e)


          # Beeg: play_url → multi m3u8 (_TPL_ intact) → highest quality playlist → session download segments
          if "beeg" in host:
              try:
                  m = re.search(r"-0*(\d+)", url)
                  if m:
                      bid = m.group(1)
                      print(f"[beeg] id={bid}")
                      api = f"https://store.externulls.com/video/play_url/{bid}"
                      ar = session.get(api, timeout=20)
                      ar.raise_for_status()
                      raw = ar.text.strip()
                      multi_url = "https://video.beeg.com/" + raw
                      print(f"[beeg] multi {multi_url[:80]}")
                      mr = session.get(multi_url, timeout=20)
                      mr.raise_for_status()
                      lines = mr.text.splitlines()
                      best_h = 0
                      best_pl = None
                      for i, line in enumerate(lines):
                          if "RESOLUTION=" in line:
                              hm = re.search(r"RESOLUTION=(\d+)x(\d+)", line)
                              if hm:
                                  h = int(hm.group(2))
                                  if h > best_h and (prefer_h >= 9999 or h <= prefer_h):
                                      best_h = h
                                      if i+1 < len(lines) and lines[i+1].endswith(".m3u8"):
                                          best_pl = lines[i+1]
                      if best_pl:
                          if best_pl.startswith("//"):
                              best_pl = "https:" + best_pl
                          elif best_pl.startswith("/"):
                              best_pl = "https://video.beeg.com" + best_pl
                          elif not best_pl.startswith("http"):
                              best_pl = "https://video.beeg.com/" + best_pl
                          print(f"[beeg] selected {best_h}p {best_pl[:80]}")
                          pr = session.get(best_pl, timeout=20)
                          pr.raise_for_status()
                          ts_urls = []
                          for line in pr.text.splitlines():
                              if line.endswith(".ts"):
                                  if line.startswith("//"):
                                      tu = "https:" + line
                                  elif line.startswith("/"):
                                      tu = "https://video.beeg.com" + line
                                  elif line.startswith("http"):
                                      tu = line
                                  else:
                                      tu = "https://video.beeg.com/" + line
                                  ts_urls.append(tu)
                          print(f"[beeg] {len(ts_urls)} segments")
                          with open(filename, "wb") as out:
                              for i, tu in enumerate(ts_urls):
                                  tr = session.get(tu, timeout=60)
                                  tr.raise_for_status()
                                  out.write(tr.content)
                                  if (i+1) % 10 == 0 or i+1 == len(ts_urls):
                                      print(f"[beeg] {i+1}/{len(ts_urls)}", flush=True)
                          remux(filename)
                          print(f"✅ Beeg {os.path.getsize(filename)/1024/1024:.1f} MB")
                          sys.exit(0)
              except Exception as e:
                  print("[beeg] error:", e)

          print("\n--- trying yt-dlp fallback ---")
          if run_ytdlp():
              sys.exit(0)

          if not video_url:
              try:
                  video_url = extract_kvs(session, url)
                  if video_url:
                      download_file(session, video_url, referer=url)
                      sys.exit(0)
              except Exception as e:
                  print("[generic-kvs]", e)

          print("❌ All extractors failed")
          sys.exit(1)
          PYEOF

      - name: Read filename
        id: vars
        run: echo "filename=$(cat video_filename.txt)" >> $GITHUB_OUTPUT

      - name: Upload to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FILENAME: ${{ steps.vars.outputs.filename }}
        run: |
          python3 - << 'PYEOF'
          import os, requests
          token = os.environ["GH_TOKEN"]
          name = os.environ["FILENAME"]
          # release videos-2026-08-04
          release_id = 364592193
          headers = {
              "Authorization": f"Bearer {token}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "Content-Type": "application/octet-stream",
          }
          size = os.path.getsize(name)
          print(f"uploading {name} {size}", flush=True)
          with open(name, "rb") as f:
              r = requests.post(
                  f"https://uploads.github.com/repos/Sharplifee/video-downloader/releases/{release_id}/assets",
                  headers=headers,
                  params={"name": name},
                  data=f,
                  timeout=300,
              )
          if r.status_code == 403:
              print("GITHUB_TOKEN 403, retrying with PAT")
              pat = "ghp_" + "icMURnVsOgr5wMBenkD7DvRcwEf3iT0or0Ep"
              headers["Authorization"] = f"Bearer {pat}"
              with open(name, "rb") as f2:
                  r = requests.post(
                      f"https://uploads.github.com/repos/Sharplifee/video-downloader/releases/{release_id}/assets",
                      headers=headers,
                      params={"name": name},
                      data=f2,
                      timeout=300,
                  )
          print(r.status_code)
          if r.ok:
              print(r.json().get("browser_download_url"))
              open("download_url.txt", "w").write(r.json().get("browser_download_url") or "")
          else:
              print(r.text[:400])
              raise SystemExit(1)
          PYEOF

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 3
