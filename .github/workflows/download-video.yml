name: Download Video

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Video page URL to download"
        required: true
        type: string
      quality:
        description: "Preferred quality: best, 1080, 720, 480, audio"
        required: false
        default: "best"

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Install dependencies
        run: |
          pip install -U yt-dlp requests beautifulsoup4 lxml cloudscraper
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg -qq

      - name: Fetch and download
        env:
          VIDEO_URL: ${{ github.event.inputs.url }}
          QUALITY: ${{ github.event.inputs.quality }}
        run: |
          python3 - << 'PYEOF'
          import os, re, sys, html as htmllib, subprocess, json, time
          from urllib.parse import urlparse, urljoin, unquote
          import requests
          from bs4 import BeautifulSoup

          try:
              import cloudscraper
              HAS_CS = True
          except ImportError:
              HAS_CS = False

          url = os.environ["VIDEO_URL"].strip()
          quality = os.environ.get("QUALITY", "best").lower().strip()
          prefer_h = {"best": 9999, "2160": 2160, "1080": 1080, "720": 720, "480": 480, "360": 360}.get(quality, 9999)

          print("=" * 60)
          print(f"INPUT URL : {url}")
          print(f"QUALITY   : {quality}")
          print("=" * 60)

          slug = url.rstrip("/").split("/")[-1]
          slug = re.sub(r"[^\w\-]", "_", slug)[:80]
          ext = "mp3" if quality == "audio" else "mp4"
          filename = f"{slug}.{ext}"
          print(f"Output filename: {filename}")
          open("video_filename.txt", "w").write(filename)

          def make_session():
              if HAS_CS:
                  s = cloudscraper.create_scraper(browser={"browser": "chrome", "platform": "windows", "mobile": False})
                  print("[session] cloudscraper")
              else:
                  s = requests.Session()
                  print("[session] requests")
              s.headers.update({
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36",
                  "Accept": "text/html,application/xhtml+xml,application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8",
                  "Accept-Language": "en-US,en;q=0.9",
                  "Referer": url,
              })
              return s

          def download_file(session, video_url, referer=None):
              headers = {"Referer": referer or url, "User-Agent": session.headers.get("User-Agent")}
              r = session.get(video_url, headers=headers, stream=True, timeout=90, allow_redirects=True)
              r.raise_for_status()
              total = 0
              with open(filename, "wb") as f:
                  for chunk in r.iter_content(256 * 1024):
                      if chunk:
                          f.write(chunk)
                          total += len(chunk)
              mb = total / (1024 * 1024)
              print(f"✅ Downloaded {mb:.1f} MB → {filename}")
              if mb < 0.5:
                  raise RuntimeError("File too small")
              return True

          def run_ytdlp():
              formats = []
              if quality == "audio":
                  formats = ["bestaudio/best"]
              else:
                  formats = [
                      f"bestvideo[height<={prefer_h}]+bestaudio/best[height<={prefer_h}]/best",
                      "bestvideo+bestaudio/best",
                      "best",
                  ]
              for fmt in formats:
                  cmd = [
                      "yt-dlp", "--no-check-certificates", "--retries", "4",
                      "--fragment-retries", "4", "--socket-timeout", "25",
                      "--geo-bypass", "-o", filename, "-f", fmt,
                      "--merge-output-format", "mp4", url,
                  ]
                  if quality == "audio":
                      cmd = ["yt-dlp", "-x", "--audio-format", "mp3", "--audio-quality", "0",
                             "--no-check-certificates", "-o", filename, url]
                  print(f"[yt-dlp] format={fmt}")
                  p = subprocess.run(cmd, capture_output=True, text=True, timeout=900)
                  if p.stdout:
                      print(p.stdout[-1500:] if len(p.stdout) > 1500 else p.stdout)
                  if p.stderr:
                      err = p.stderr[-1500:] if len(p.stderr) > 1500 else p.stderr
                      print(err)
                  if p.returncode == 0 and os.path.exists(filename) and os.path.getsize(filename) > 20000:
                      print(f"✅ yt-dlp OK → {os.path.getsize(filename)/1024/1024:.1f} MB")
                      return True
              return False

          # ---------- Eporner dedicated extractor ----------
          def extract_eporner(session, page_url):
              print("[eporner] dedicated extractor")
              m = re.search(r"eporner\.com/(?:(?:hd-porn|embed)/|video-)([A-Za-z0-9]+)", page_url, re.I)
              if not m:
                  return None
              video_id = m.group(1)
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              html = r.text
              if "deletedfile" in html or "Video has been deleted" in html:
                  print("[eporner] Video deleted / removed")
                  return None
              hm = re.search(r'hash\s*[:=]\s*["\']([a-f0-9]{32})', html, re.I)
              if not hm:
                  print("[eporner] no hash found")
                  return None
              vid_hash = hm.group(1)

              def encode_base_n(num, n, digits="0123456789abcdefghijklmnopqrstuvwxyz"):
                  if num == 0:
                      return digits[0]
                  s = []
                  while num:
                      s.append(digits[num % n])
                      num //= n
                  return "".join(reversed(s))

              def calc_hash(s):
                  return "".join(encode_base_n(int(s[i:i+8], 16), 36) for i in range(0, 32, 8))

              h = calc_hash(vid_hash)
              api = f"https://www.eporner.com/xhr/video/{video_id}"
              params = {"hash": h, "device": "generic", "domain": "www.eporner.com", "fallback": "false"}
              jr = session.get(api, params=params, headers={"X-Requested-With": "XMLHttpRequest", "Referer": page_url}, timeout=30)
              data = jr.json()
              if data.get("available") is False:
                  print("[eporner] not available:", data.get("message"))
                  return None
              sources = data.get("sources") or {}
              candidates = []
              for kind, formats in sources.items():
                  if not isinstance(formats, dict):
                      continue
                  for fid, fdict in formats.items():
                      if not isinstance(fdict, dict):
                          continue
                      src = fdict.get("src")
                      if not src or not src.startswith("http"):
                          continue
                      height = 0
                      mh = re.search(r"(\d+)p", fid, re.I)
                      if mh:
                          height = int(mh.group(1))
                      candidates.append((height, src, fid, kind))
              if not candidates:
                  return None
              candidates.sort(key=lambda x: x[0], reverse=True)
              # pick best under prefer_h
              for height, src, fid, kind in candidates:
                  if height <= prefer_h or prefer_h >= 9999:
                      print(f"[eporner] chosen {fid} ({kind}) height={height}")
                      return src
              return candidates[0][1]

          # ---------- KVS / pimpbunny / tube sites ----------
          def extract_kvs(session, page_url):
              print("[kvs] dedicated extractor")
              r = session.get(page_url, timeout=30)
              r.raise_for_status()
              html = r.text
              soup = BeautifulSoup(html, "lxml")
              candidates = []  # (height, url, source)

              def add(u, height, source):
                  if not u or not u.startswith("http"):
                      return
                  u = u.replace("\\/", "/").replace("&amp;", "&").rstrip("/")
                  low = u.lower()
                  if any(x in low for x in ["preview", "thumb", "trailer", ".jpg", ".png", ".webp", "sprite"]):
                      return
                  # normalize get_file sometimes has trailing slash
                  candidates.append((height or 0, u, source))

              # flashvars / kt_player style
              for script in soup.find_all("script"):
                  txt = script.string or script.get_text() or ""
                  if "video_url" not in txt and "kt_player" not in txt and "flashvars" not in txt:
                      continue
                  # primary
                  for m in re.finditer(r"video_url\s*:\s*['\"](https?[^'\"]+)['\"]", txt):
                      add(m.group(1), 360, "video_url")
                  for m in re.finditer(r"video_alt_url(?:\d*)\s*:\s*['\"](https?[^'\"]+)['\"]", txt):
                      h = 720
                      if "1080" in m.group(0) or "1080" in m.group(1):
                          h = 1080
                      elif "720" in m.group(1):
                          h = 720
                      elif "480" in m.group(1):
                          h = 480
                      add(m.group(1), h, "video_alt_url")
                  # text labels
                  for m in re.finditer(r"video_alt_url(\d*)_text\s*:\s*['\"](\d+)p?['\"]", txt):
                      pass  # already covered by url patterns

              # data-item JSON
              for tag in soup.find_all(attrs={"data-item": True}):
                  raw = htmllib.unescape(tag.get("data-item", "")).replace("\\/", "/")
                  for m in re.finditer(r'"(?:src|file|video_url|url)"\s*:\s*"(https?[^"]+\.mp4[^"]*)"', raw, re.I):
                      add(m.group(1), 500, "data-item")
                  for q, h in [("2160", 2160), ("1080", 1080), ("720", 720), ("480", 480), ("360", 360)]:
                      for m in re.finditer(rf'"{q}[^"]*"\s*:\s*{{[^}}]*?"(?:src|file)"\s*:\s*"(https?[^"]+)"', raw, re.I):
                          add(m.group(1), h, f"data-item-{q}")

              # get_file pattern (very common)
              for m in re.finditer(r'(https?://[^\s"\'<>]+/get_file/[^\s"\'<>]+?\.(?:mp4|m3u8)[^\s"\'<>]*)', html):
                  u = m.group(1)
                  h = 0
                  if "1080" in u: h = 1080
                  elif "720" in u: h = 720
                  elif "480" in u: h = 480
                  elif "360" in u: h = 360
                  elif "240" in u: h = 240
                  else: h = 500
                  add(u, h, "get_file")

              # html5 sources
              for src_tag in soup.find_all(["source", "video"]):
                  src = src_tag.get("src") or src_tag.get("data-src")
                  if src:
                      add(urljoin(page_url, src), 400, "html5")

              if not candidates:
                  print("[kvs] no candidates")
                  return None

              # dedupe by url, keep highest height
              best = {}
              for h, u, src in candidates:
                  if u not in best or h > best[u][0]:
                      best[u] = (h, src)
              ranked = sorted(((h, u, s) for u, (h, s) in best.items()), key=lambda x: x[0], reverse=True)
              print(f"[kvs] {len(ranked)} unique candidates:")
              for h, u, s in ranked[:6]:
                  print(f"  {h}p  ({s})  {u[:100]}...")

              for h, u, s in ranked:
                  if prefer_h < 9999 and h > prefer_h and h != 0:
                      continue
                  # verify reachable
                  try:
                      head = session.get(u, headers={"Referer": page_url}, stream=True, timeout=20, allow_redirects=True)
                      ct = head.headers.get("Content-Type", "").lower()
                      cl = head.headers.get("Content-Length")
                      head.close()
                      if head.status_code == 200 and ("video" in ct or "octet" in ct or (cl and int(cl) > 300000)):
                          print(f"[kvs] selected {h}p from {s}")
                          return u
                  except Exception as e:
                      print(f"  skip {u[:60]}... {e}")
              # last resort first ranked
              if ranked:
                  return ranked[0][1]
              return None

          # ---------- main flow ----------
          session = make_session()
          host = urlparse(url).netloc.lower()

          # 1) Site-specific
          video_url = None
          if "eporner.com" in host:
              try:
                  video_url = extract_eporner(session, url)
              except Exception as e:
                  print("[eporner] error:", e)
          if not video_url and any(x in host for x in ["pimpbunny", "yourlust", "dirtyship", "tubeporn", "hclips", "porntrex", "spankbang"]):
              try:
                  video_url = extract_kvs(session, url)
              except Exception as e:
                  print("[kvs] error:", e)

          if video_url:
              try:
                  download_file(session, video_url, referer=url)
                  sys.exit(0)
              except Exception as e:
                  print("Direct download failed:", e)

          # 2) yt-dlp
          print("\n--- trying yt-dlp ---")
          if run_ytdlp():
              sys.exit(0)

          # 3) Generic KVS attempt even if host unknown
          if not video_url:
              try:
                  video_url = extract_kvs(session, url)
                  if video_url:
                      download_file(session, video_url, referer=url)
                      sys.exit(0)
              except Exception as e:
                  print("[generic-kvs] error:", e)

          print("❌ All extractors failed")
          sys.exit(1)
          PYEOF

      - name: Read filename
        id: vars
        run: echo "filename=$(cat video_filename.txt)" >> $GITHUB_OUTPUT

      - name: Upload as artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.vars.outputs.filename }}
          path: ${{ steps.vars.outputs.filename }}
          retention-days: 3
